name: Fix Header Links (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix fav-link in event pages
        run: python3 scripts/fix-header-fav-link.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events/
          git diff --staged --quiet || git commit -m "fix: replace fav-link with ikitai-blob-btn in event pages"
          git push
