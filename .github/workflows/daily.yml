name: Daily Maintenance

# 統合元: auto-status-update.yml + check-date-updates.yml + update-sitemap.yml
# 毎日 06:00 JST (21:00 UTC) に実行
# 1. 各公式ページから日付検証で events.json 補正
# 2. upcoming → past 自動遷移
# 3. 全 static (detail / sitemap / RSS / iCal / CSV / landing) 再生成

on:
  schedule:
    - cron: '0 21 * * *'
  # events.json が変わったpushで再生成する(2026-07-31)。
  # Chrome経由のrepository_dispatchが認証ヘッダ遮断で送れなくなったため、
  # dispatchに依存しない経路を用意した。GITHUB_TOKENのpushは
  # ワークフローを再起動しない仕様なので自己ループしない。
  push:
    branches: [main]
    paths:
      - 'events.json'
      # 巡回スクリプトを直したら回して結果を確かめられるようにする。
      # CI側(GITHUB_TOKEN)のpushはワークフローを再起動しない仕様なので、
      # sync-events が events.json を更新しても daily は発火しない。
      # 手で直したときに確認する経路が無いと、動くかどうかを翌朝まで待つことになる。
      - 'scripts/coverage-sweep.py'
      - 'scripts/check-cancelled.py'
      - 'scripts/ig-organizer-watch.py'
      # sitelib は生成物すべての単一情報源(会場スラッグ・CSS/JS版数・
      # 日付整形)。ここを直しても再生成が走らないので、翌朝まで本番は
      # 旧版のままだった。2026-09-17、会場ローマ字URLを2件足した直後に
      # venue_redirect_broken(urgent) が鳴り、宛先の頁はビルドされていなかった。
      # **「直した」と「本番に出ている」が別なのは §5 に書いてあるが、
      # 出す経路そのものが無かった。**
      - 'scripts/sitelib.py'
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      skip_date_check:
        description: 'check_date_updates をスキップ'
        type: boolean
        default: false

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定の depth 1 だと監査 ci_generated_paths_drift が
          # 直近のCIコミットを1件も見られず、黙って無効になる。
          # ci-push.sh の復旧が取る merge-base の足場にもなる。
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      # push で入ったときは「何が変わったか」で巡回の要否を決める。
      # 巡回(外部サイトを叩く3ステップ)は6〜9分かかり、cancel-watch.json と
      # coverage-gaps.json を毎回書き換える。この2つは同時に走った回と
      # 必ず衝突するので、**用が無い push で回すと事故だけが増える**
      # (2026-09-15 と 09-17 の daily はどちらもこれで落ちた)。
      # 巡回スクリプト自身を直した回は確かめたいので、そこだけ回す。
      - name: What changed (push のときだけ)
        id: changed
        if: github.event_name == 'push'
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD || true)
          echo "$FILES"
          if echo "$FILES" | grep -qE '^scripts/(coverage-sweep|check-cancelled|ig-organizer-watch)\.py$'; then
            echo "crawl=true" >> $GITHUB_OUTPUT
          else
            echo "crawl=false" >> $GITHUB_OUTPUT
          fi

      - name: Check date updates (scrape official sources)
        # pushトリガ(再生成目的)では外部サイトを叩かない
        if: github.event_name != 'push' && github.event.inputs.skip_date_check != 'true'
        run: python3 scripts/check_date_updates.py || true

      # UTC判定の Auto status update ステップは 2026-08-10 に削除した(移管は 2026-08-03)。
      # ランナーはUTCで、06:00 JST 実行時は前日21:00 UTC。date.today() では
      # 「JSTで昨日終了」の回が past にならず、丸一日 upcoming のまま配信されていた。
      # 判定は scripts/auto-status-jst.py に移し、build-all.sh の先頭で必ず走る。
      # 全ワークフローが build-all.sh を通るので、どの経路から入っても同じ不変条件になる。
      #
      # index.html の開催予定バッジを更新するステップも同時に削除した。
      # このステップは build-all.sh より前に走るので status 更新前の値を数えており、
      # sync-events / weekly-enrichment 経由のビルドでは誰も更新していなかった。
      # scripts/sync-index-cards.py(build-all.sh 内)に移管した。

      # 他所に載っていて当サイトに無いイベントを毎日拾う。
      # 2026-08-27、掲載2件に対して関東で10件以上、9月は全国で42件の
      # 未掲載が見つかった。そのとき audit は urgent 0 / info 0 だった。
      # 手元の整合性だけ見ていて、外の世界に対する欠けを誰も見ていなかった。
      # 失敗しても後続を止めない(|| true)が、失敗自体は coverage-gaps.json の
      # errors に残り、audit の coverage_sweep_broken が鳴る。
      - name: Sweep coverage gaps (他所にあって当サイトに無いイベント)
        if: github.event_name != 'push' || steps.changed.outputs.crawl == 'true'
        run: python3 scripts/coverage-sweep.py --days 45 || true

      # 逆向きの巡回。載せた回がもう開催されないことに気づくための経路。
      # 2026-09-08まで掲載は追加の一方通行で、Collect Plants Vol.3 は
      # 中止告知(2026-08-12)の27日後まで開催予定として載り続けていた。
      # 失敗しても後続を止めないが、失敗は cancel-watch.json の errors に残り
      # audit の cancel_watch_broken が鳴る。
      - name: Watch for cancellations (載せた回が中止・延期になっていないか)
        if: github.event_name != 'push' || steps.changed.outputs.crawl == 'true'
        run: python3 scripts/check-cancelled.py || true

      # 主催者の Instagram を Business Discovery で見る(2026-09-23)。
      # check-cancelled.py は Instagram を見られないので、出典が Instagram の回は
      # こちらが中止の見張りになる。結果は organizer-posts.json に出て、
      # audit の organizer_cancel_signal(urgent) / organizer_unlisted_dates が読む。
      - name: Watch organizers on Instagram (主催者の最新投稿)
        if: github.event_name != 'push' || steps.changed.outputs.crawl == 'true'
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python3 scripts/ig-organizer-watch.py || true

      - name: Regenerate all static files
        run: bash scripts/build-all.sh

      - name: Commit and push
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          bash scripts/ci-push.sh "chore(daily): status update + date verification + regen all" "bash scripts/build-all.sh"
