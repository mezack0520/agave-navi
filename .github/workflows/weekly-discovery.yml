name: Weekly Discovery

# 統合元: crawl-events.yml + discover-sources.yml + issue-to-candidates.yml
# 毎週水曜 09:00 JST (00:00 UTC) に実行
# 1. 既存ソース巡回 (crawl_events.py) → staging に流す
# 2. 新規ソース発見 (discover_sources.py) → Issue化
# 3. Issue 由来の候補集約 (issue-to-candidates.py) → staging

on:
  schedule:
    - cron: '0 0 * * 3'
  repository_dispatch:
    types: [weekly-discovery]
  workflow_dispatch:

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Crawl existing aggregator sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/crawl_events.py || true

      - name: Discover new aggregator sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python3 scripts/discover_sources.py || true

      - name: Aggregate issue → candidates.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/issue-to-candidates.py || true

      - name: Import shop additions from Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/issue-to-shops.py || true

      - name: Commit candidate updates
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          bash scripts/ci-push.sh "chore(weekly-discovery): refresh staging/candidates + sources"
