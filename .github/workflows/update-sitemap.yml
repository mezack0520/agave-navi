name: Update Sitemap

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'events/*.html'
      - 'category/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet sitemap.xml && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push sitemap
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap.xml [skip ci]"
          # Robust push with rebase+retry to avoid concurrent-push races
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "::warning::push failed (attempt $attempt/5); pulling --rebase and retrying..."
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          done
      - name: Ping Google Search Console
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://agave-navi.com/sitemap.xml" || true
          echo "Pinged Google with updated sitemap"
