name: Auto Generate Event Page

on:
  repository_dispatch:
    types: [new-event]

permissions:
  contents: write

jobs:
  generate-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Save event payload to new-events.json
        run: |
          python3 << 'PYEOF'
          import json, os
          payload = json.loads('''${{ toJson(github.event.client_payload) }}''')
          if isinstance(payload, dict):
              payload = [payload]
          # Sanity: must have slug + name
          payload = [e for e in payload if e.get('slug') and e.get('name')]
          if not payload:
              print('No valid events in payload'); exit(0)
          # Write or merge into new-events.json (which sync-events.yml's logic handles)
          existing = []
          if os.path.exists('new-events.json'):
              with open('new-events.json') as f:
                  existing = json.load(f)
          existing.extend(payload)
          with open('new-events.json','w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(f'Wrote {len(payload)} new event(s) to new-events.json')
          PYEOF

      - name: Sanity-check new-events.json (drop ticketing/aggregator entries)
        run: |
          if [ -f new-events.json ]; then
            python3 scripts/sanity-check-new-events.py --in new-events.json
          fi

      - name: Merge new-events.json
        run: |
          python3 << 'PYEOF'
          import json, os
          if not os.path.exists('new-events.json'):
              exit(0)
          with open('events.json') as f: events = json.load(f)
          with open('new-events.json') as f: new_events = json.load(f)
          existing = {e['slug'] for e in events}
          added = []
          for ne in new_events:
              if ne['slug'] not in existing:
                  events.append(ne); added.append(ne['slug'])
          events.sort(key=lambda e: (0 if e.get('status')=='upcoming' else 1, e.get('date','')))
          with open('events.json','w', encoding='utf-8') as f:
              json.dump(events, f, ensure_ascii=False, indent=2); f.write('\n')
          print(f'Added: {", ".join(added) or "(none)"}')
          # Stash added slugs for next step
          import subprocess
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'slugs={",".join(added)}\n')
          PYEOF
        id: merge

      - name: Enrich newly added slugs (Brave Search)
        if: steps.merge.outputs.slugs != ''
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          IFS=',' read -ra SLUGS <<< "${{ steps.merge.outputs.slugs }}"
          for slug in "${SLUGS[@]}"; do
            echo "::group::Enrich $slug"
            python3 scripts/enrich_events.py --slug "$slug" --write-back --no-remove || true
            echo "::endgroup::"
          done

      - name: Build all detail pages from template
        run: python3 build-detail-pages.py

      - name: Sync index.html card images with events.json
        run: python3 scripts/sync-index-cards.py

      - name: Generate RSS feed
        run: python3 scripts/generate-rss.py

      - name: Update dynamic ItemList JSON-LD on homepage
        run: python3 scripts/generate-itemlist-jsonld.py

      - name: Add cards to index.html for new slugs
        if: steps.merge.outputs.slugs != ''
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('events.json') as f: events = json.load(f)
          with open('index.html') as f: html = f.read()
          existing = set(re.findall(r'data-slug="([^"]+)"', html))
          ev_map = {e['slug']: e for e in events}
          new_slugs = [s for s in "${{ steps.merge.outputs.slugs }}".split(',')
                       if s and s not in existing and ev_map.get(s, {}).get('status')=='upcoming']
          if not new_slugs:
              print('No cards to add'); exit(0)
          marker = '</div><!-- /eventsGrid -->'
          cards = ''
          for slug in new_slugs:
              e = ev_map.get(slug)
              if not e: continue
              tags_csv = ','.join(e.get('tags', []))
              dd = e.get('dateDisplay', e.get('date','').replace('-','.'))
              pref = e.get('prefecture','') ; region = e.get('region','')
              ad = e.get('addedDate','')
              img = e.get('imageUrl','')
              if img:
                  thumb = f'<div class="event-thumb"><img src="{img}" alt="{e["name"]}" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add(\\'event-no-image\\');this.remove();"></div>'
              else:
                  thumb = '<div class="event-thumb event-no-image"></div>'
              card = f'''<div class="event-card" data-tags="{tags_csv}" data-status="upcoming" data-region="{region}" data-prefecture="{pref}" data-slug="{slug}" data-date="{e.get('date','')}" data-date-end="{e.get('dateEnd','')}" data-added-date="{ad}">
              {thumb}
              <button class="fav-btn" onclick="toggleFav(event,'{slug}')" aria-label="行きたい"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
              <div class="swipe-hint"><div class="swipe-hint-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
              <div class="event-card-body">
                <div class="event-header"><span class="event-date">{dd}</span><span class="event-status"></span></div>
                <h3 class="event-title">{e['name']}</h3>
                <p class="event-description">{e.get('description','')}</p>
                <div class="event-meta-row"><span class="event-region">{pref or region}</span></div>
              </div>
              <div class="card-fav-bar" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>行きたい</span></div>
            </div>
              '''
              cards += card
          html = html.replace(marker, cards + marker)
          up_count = sum(1 for e in events if e.get('status')=='upcoming')
          html = re.sub(r'<span class="event-count" id="eventCount">\d+件</span>',
                        f'<span class="event-count" id="eventCount">{up_count}件</span>', html)
          with open('index.html','w') as f: f.write(html)
          print(f'Added {len(new_slugs)} card(s)')
          PYEOF

      - name: Generate landing pages
        run: python3 scripts/generate-landing-pages.py

      - name: Generate iCal feeds
        run: python3 scripts/generate-ical.py

      - name: Generate CSV export
        run: python3 scripts/generate-csv.py

      - name: Update sitemap
        run: python3 scripts/generate_sitemap.py

      - name: Cleanup new-events.json
        run: rm -f new-events.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"; exit 0
          fi
          NAMES="${{ steps.merge.outputs.slugs }}"
          git commit -m "feat: auto-add event(s) ${NAMES}"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "::warning::push failed (attempt $attempt/5); pulling --rebase and retrying..."
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          done
