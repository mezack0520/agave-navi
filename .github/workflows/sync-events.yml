name: Sync New Events

on:
  # new-events.json が置かれたpushで取り込む(2026-07-31)。dispatch依存を無くす。
  # GITHUB_TOKENのpushはワークフローを再起動しない仕様なので自己ループしない。
  push:
    branches: [main]
    paths:
      - 'new-events.json'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-events]

# **daily / health と同じ group に入れない(2026-09-12)。**
# GitHub は1つの concurrency group に pending を1本しか置けないので、
# events.json と new-events.json を同じ push に入れると daily / health /
# sync-events の3本が同時に queue され、**真ん中の sync-events が
# その場で cancelled になる。** 取り込みは走らず new-events.json は
# 公開URLに残ったままで、成功した2本だけが緑になるので気づけない
# (2026-09-12 の push 18f91fc で実際に起きた。新規4件が落ちた)。
# events.json への同時書き込みは scripts/ci-push.sh が捌く(2026-09-07)ので、
# 直列化のために group を共有する必要はもう無い。
concurrency:
  group: sync-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # repository_dispatch のRunはdispatch時点のSHAにピン留めされるため、
      # 多重dispatchで遅れて走ったRunが古いツリーを再処理しないよう最新mainに同期する。
      # 消化済みならnew-events.jsonが無く、以降のステップは自然にno-opになる(2026-07-28 競合失敗の恒久対応)
      - name: Sync to latest main (duplicate-dispatch safety)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Sanity-check new-events.json (drop ticketing/aggregator entries)
        run: |
          if [ -f new-events.json ]; then
            python3 scripts/sanity-check-new-events.py --in new-events.json
          fi

      - name: Merge new-events.json (if exists)
        run: python3 scripts/merge-new-events.py

      - name: Detect newly added slugs
        id: newslugs
        run: python3 scripts/detect-new-slugs.py >> $GITHUB_OUTPUT

      - name: Enrich newly added slugs (Brave Search → og:image/url/etc)
        if: steps.newslugs.outputs.slugs != ''
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          pip install requests beautifulsoup4 lxml pillow
          IFS=',' read -ra SLUGS <<< "${{ steps.newslugs.outputs.slugs }}"
          for slug in "${SLUGS[@]}"; do
            echo "::group::Enrich $slug"
            python3 scripts/enrich_events.py --slug "$slug" --write-back --no-remove || true
            # fetch-event-images.py はここでは走らせない(IPからIGに届かない)。
            # ブラウザを持つセッションから実行する
            echo "::endgroup::"
          done

      # カードの挿入は scripts/sync-index-cards.py が持つ(build-all.sh から走る)。
      # 2026-08-31まではここにPythonを直書きしていたが、ローカルのビルドでは
      # 走らないので手で足した回のカードが作られず、監査が
      # 「sync-index-cards.py を再実行する」と案内しても直らなかった。

      - name: Regenerate all static files
        run: bash scripts/build-all.sh


      - name: Remove new-events.json after processing
        run: |
          if [ -f new-events.json ]; then
            rm new-events.json
            echo "Removed new-events.json"
          fi

      - name: Commit and push
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          bash scripts/ci-push.sh "feat: sync events & rebuild detail pages" "bash scripts/build-all.sh"
