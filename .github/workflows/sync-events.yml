name: Sync New Events

on:
  # new-events.json が置かれたpushで取り込む(2026-07-31)。dispatch依存を無くす。
  # GITHUB_TOKENのpushはワークフローを再起動しない仕様なので自己ループしない。
  push:
    branches: [main]
    paths:
      - 'new-events.json'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-events]

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # repository_dispatch のRunはdispatch時点のSHAにピン留めされるため、
      # 多重dispatchで遅れて走ったRunが古いツリーを再処理しないよう最新mainに同期する。
      # 消化済みならnew-events.jsonが無く、以降のステップは自然にno-opになる(2026-07-28 競合失敗の恒久対応)
      - name: Sync to latest main (duplicate-dispatch safety)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Sanity-check new-events.json (drop ticketing/aggregator entries)
        run: |
          if [ -f new-events.json ]; then
            python3 scripts/sanity-check-new-events.py --in new-events.json
          fi

      - name: Merge new-events.json (if exists)
        run: |
          python3 << 'PYEOF'
          import json, os

          if not os.path.exists("new-events.json"):
              print("No new-events.json found. Skipping merge.")
              exit(0)

          with open("events.json", "r", encoding="utf-8") as f:
              events = json.load(f)

          with open("new-events.json", "r", encoding="utf-8") as f:
              new_events = json.load(f)

          existing = {e["slug"] for e in events}
          added = []
          updated = []

          for ne in new_events:
              if ne["slug"] not in existing:
                  events.append(ne)
                  added.append(ne["slug"])
              else:
                  for e in events:
                      if e["slug"] == ne["slug"]:
                          for k, v in ne.items():
                              if v and v != e.get(k):
                                  e[k] = v
                                  if ne["slug"] not in updated:
                                      updated.append(ne["slug"])
                          break

          events.sort(key=lambda e: (0 if e.get("status")=="upcoming" else 1, e.get("date","")))

          with open("events.json", "w", encoding="utf-8") as f:
              json.dump(events, f, indent=2, ensure_ascii=False)

          up = sum(1 for e in events if e.get("status")=="upcoming")
          print(f"Total: {len(events)}, Upcoming: {up}")
          if added:
              print(f"Added {len(added)}: {', '.join(added)}")
          if updated:
              print(f"Updated {len(updated)}: {', '.join(updated)}")
          if not added and not updated:
              print("No changes.")
          PYEOF

      - name: Detect newly added slugs
        id: newslugs
        run: |
          python3 << 'PYEOF' >> $GITHUB_OUTPUT
          import json, os, subprocess
          # Compare current events.json to git HEAD (pre-merge) to find newly added slugs
          try:
              prev = subprocess.run(['git','show','HEAD:events.json'], capture_output=True, text=True).stdout
              prev_slugs = {e.get('slug') for e in json.loads(prev)}
          except Exception:
              prev_slugs = set()
          with open('events.json') as f:
              cur = json.load(f)
          new_slugs = sorted({e['slug'] for e in cur if e.get('slug') not in prev_slugs})
          print(f'slugs={",".join(new_slugs)}')
          PYEOF

      - name: Enrich newly added slugs (Brave Search → og:image/url/etc)
        if: steps.newslugs.outputs.slugs != ''
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          pip install requests beautifulsoup4 lxml
          IFS=',' read -ra SLUGS <<< "${{ steps.newslugs.outputs.slugs }}"
          for slug in "${SLUGS[@]}"; do
            echo "::group::Enrich $slug"
            python3 scripts/enrich_events.py --slug "$slug" --write-back --no-remove || true
            echo "::endgroup::"
          done

      # カードの挿入は scripts/sync-index-cards.py が持つ(build-all.sh から走る)。
      # 2026-08-31まではここにPythonを直書きしていたが、ローカルのビルドでは
      # 走らないので手で足した回のカードが作られず、監査が
      # 「sync-index-cards.py を再実行する」と案内しても直らなかった。

      - name: Regenerate all static files
        run: bash scripts/build-all.sh


      - name: Remove new-events.json after processing
        run: |
          if [ -f new-events.json ]; then
            rm new-events.json
            echo "Removed new-events.json"
          fi

      - name: Commit and push
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          bash scripts/ci-push.sh "feat: sync events & rebuild detail pages" "bash scripts/build-all.sh"
