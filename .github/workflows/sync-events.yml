name: Sync New Events

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-events]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge new events into events.json
        run: |
          python3 << 'PYEOF'
          import json, os

          if not os.path.exists("new-events.json"):
              print("No new-events.json found. Nothing to do.")
              exit(0)

          with open("events.json", "r", encoding="utf-8") as f:
              events = json.load(f)

          with open("new-events.json", "r", encoding="utf-8") as f:
              new_events = json.load(f)

          existing = {e["slug"] for e in events}
          added = []
          updated = []

          for ne in new_events:
              if ne["slug"] not in existing:
                  events.append(ne)
                  added.append(ne["slug"])
              else:
                  # Update existing event fields if provided
                  for e in events:
                      if e["slug"] == ne["slug"]:
                          for k, v in ne.items():
                              if v and v != e.get(k):
                                  e[k] = v
                                  if ne["slug"] not in updated:
                                      updated.append(ne["slug"])
                          break

          events.sort(key=lambda e: (0 if e["status"]=="upcoming" else 1, e.get("date","")))

          with open("events.json", "w", encoding="utf-8") as f:
              json.dump(events, f, indent=2, ensure_ascii=False)

          up = sum(1 for e in events if e["status"]=="upcoming")
          print(f"Total: {len(events)}, Upcoming: {up}")
          if added:
              print(f"Added {len(added)}: {', '.join(added)}")
          if updated:
              print(f"Updated {len(updated)}: {', '.join(updated)}")
          if not added and not updated:
              print("No changes.")
          PYEOF

      - name: Add cards to index.html for new slugs
        run: |
          python3 << 'PYEOF'
          import json, re, os

          with open("events.json") as f:
              events = json.load(f)

          with open("index.html") as f:
              html = f.read()

          existing_slugs = set(re.findall(r'data-slug="([^"]+)"', html))
          event_map = {e["slug"]: e for e in events}
          new_slugs = [e["slug"] for e in events if e["slug"] not in existing_slugs and e["status"] == "upcoming"]

          if not new_slugs:
              print("No new cards to add to index.html")
          else:
              marker = '</div><!-- /eventsGrid -->'
              cards = ""
              for slug in new_slugs:
                  e = event_map[slug]
                  tags_csv = ",".join(e.get("tags",[]))
                  dd = e.get("dateDisplay", e["date"].replace("-","."))
                  pref = e.get("prefecture","")
                  region = e.get("region","")
                  de = e.get("dateEnd","")
                  card = f'''<div class="event-card" data-tags="{tags_csv}" data-status="upcoming" data-region="{region}" data-prefecture="{pref}" data-slug="{slug}">
              <div class="event-thumb event-no-image"></div>
              <button class="fav-btn" onclick="toggleFav(event,'{slug}')" aria-label="\u884c\u304d\u305f\u3044\u3044">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
              <div class="swipe-hint"><div class="swipe-hint-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
              <div class="event-card-body">
                <div class="event-header"><span class="event-date">{dd}</span><span class="event-status"></span></div>
                <h3 class="event-title">{e['name']}</h3>
                <p class="event-description">{e.get('description','')}</p>
                <div class="event-meta-row"><span class="event-region">{pref}</span></div>
                <a href="events/{slug}.html" class="event-link">\u8a73\u7d30\u3092\u898b\u308b \u2192</a>
              </div>
              <div class="card-fav-bar" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
            </div>
              '''
                  cards += card
                  print(f"Card added: {slug}")

              html = html.replace(marker, cards + marker)
              # Update event count
              up_count = sum(1 for e in events if e["status"]=="upcoming")
              html = re.sub(r'<span class="event-count" id="eventCount">\d+\u4ef6</span>',
                            f'<span class="event-count" id="eventCount">{up_count}\u4ef6</span>', html)

              with open("index.html", "w") as f:
                  f.write(html)
              print(f"Added {len(new_slugs)} cards. Count: {up_count}")
          PYEOF

      - name: Generate missing pages
        run: python3 scripts/generate_missing_pages_v2.py

      - name: Remove new-events.json after processing
        run: |
          if [ -f new-events.json ]; then
            rm new-events.json
            echo "Removed new-events.json"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html events/ new-events.json || true
          git diff --staged --quiet || git commit -m "feat: sync new events from new-events.json"
          git push
