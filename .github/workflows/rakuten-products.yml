name: Rakuten Product Refresh

# アフィリエイト枠に出す実商品(画像・価格・アフィリエイトURL)を楽天商品検索APIから
# 取得して product-cache.json に固める。静的サイトなのでビルド時に取り、
# 閲覧時はJSONを読むだけにする(appIdを露出させず、レート制限も踏まない)。
#
# 毎週月曜 08:00 JST。価格変動をならすため週1で十分。
# secrets.RAKUTEN_APP_ID と RAKUTEN_ACCESS_KEY が必要。未設定ならスクリプト側でスキップされる。

# 2026-07-30: サーバー側からの呼び出しは 403 REQUEST_CONTEXT_BODY_HTTP_REFERRER_MISSING で
# 拒否されるため定期実行を停止した。アプリ種別 Web Application はリファラ制限があり、
# Refererヘッダを付けても通らない。現在はブラウザ側(affiliate.js)から直接呼んでいる。
# アプリ種別を API/Backend Service に変更して固定IPから叩く構成に変えるなら復活できる。
on:
  repository_dispatch:
    types: [rakuten-products]
  workflow_dispatch:
    inputs:
      limit:
        description: '検索語の件数上限 (0=全件)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: events-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Rakuten products
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python3 scripts/fetch-rakuten-products.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product-cache.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(affiliate): 楽天商品キャッシュを更新 [rakuten-products]"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "::warning::push failed (attempt $attempt/5); rebase して再試行"
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then echo "::error::push failed"; exit 1; fi
          done

      # 取得0件のまま成功扱いにしない。診断はコミット済みなので原因は追える。
      - name: Fail if nothing was fetched
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('product-cache.json', encoding='utf-8'))
          except Exception as e:
              print(f'::error::product-cache.json を読めません: {e}')
              sys.exit(1)
          n = len(d.get('items') or {})
          if n == 0:
              diag = d.get('_diagnostic') or {}
              print(f'::error::楽天APIから1件も取得できていません。診断: {json.dumps(diag, ensure_ascii=False)}')
              sys.exit(1)
          print(f'取得済み {n} 件')
          PY
