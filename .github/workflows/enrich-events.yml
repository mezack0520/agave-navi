name: Event Info Enrichment

on:
  schedule:
    # 毎週火曜 10:00 JST (月曜 01:00 UTC)
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      slug:
        description: '特定イベントのslug(空欄で全件)'
        required: false
        type: string
        default: ''
      limit:
        description: '処理件数上限(0=全件)'
        required: false
        type: string
        default: '20'
      remove_orphans:
        description: '公式情報なしイベントを削除する(デフォルトはfalse=安全)'
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run enrichment
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          ARGS="--write-back"
          if [ "${{ github.event.inputs.remove_orphans }}" != "true" ]; then
            ARGS="$ARGS --no-remove"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          echo "Running: python scripts/enrich_events.py $ARGS"
          python scripts/enrich_events.py $ARGS

      - name: Rebuild detail pages
        run: python3 build-detail-pages.py

      - name: Sync index.html card images with events.json
        run: python3 scripts/sync-index-cards.py

      - name: Generate RSS feed
        run: python3 scripts/generate-rss.py

      - name: Update dynamic ItemList JSON-LD on homepage
        run: python3 scripts/generate-itemlist-jsonld.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json events/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: enrich events.json (imageUrl/url backfill from web search) [skip ci]"
            # Robust push with rebase+retry
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "::warning::push failed (attempt $attempt/5); pulling --rebase and retrying..."
              git pull --rebase || true
              sleep $((RANDOM % 5 + 2))
              if [ $attempt -eq 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
            done
          fi

      - name: Create issue with report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/enrich-report.md ]; then
            TITLE="[情報エンリッチメント] イベント情報更新候補 $(date +%Y-%m-%d)"
            gh label create "auto-enrich" --description "自動エンリッチメントレポート" --color "0E8A16" 2>/dev/null || true
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/enrich-report.md \
              --label "enhancement,auto-enrich"
          fi

      - name: Upload enrichment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-data
          path: /tmp/enrich-data.json
          retention-days: 30
