# [DEPRECATED] This workflow has been consolidated into one of:
#   - daily.yml / weekly-enrichment.yml / weekly-discovery.yml / health.yml
# Cron trigger removed; workflow_dispatch kept for manual rollback only.

name: Weekly Source Discovery

on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run source discovery
        run: python scripts/discover_sources.py

      - name: Create issue with results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/discover-report.md ]; then
            TITLE="[自動発掘] 新規巡回先候補レポート $(date +%Y-%m-%d)"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/discover-report.md \
              --label "source-discovery"
          fi
