name: Image Health Check

on:
  schedule:
    - cron: '0 2 1 * *'  # 毎月1日 11:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python3 scripts/image-health-check.py
      - name: Rebuild + sync if events.json changed
        run: |
          if ! git diff --quiet events.json; then
            python3 build-detail-pages.py
            python3 scripts/sync-index-cards.py
          fi
      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: image health check — clear dead imageUrls [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then exit 1; fi
          done
