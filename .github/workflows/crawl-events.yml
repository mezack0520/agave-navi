# [DEPRECATED] This workflow has been consolidated into one of:
#   - daily.yml / weekly-enrichment.yml / weekly-discovery.yml / health.yml
# Cron trigger removed; workflow_dispatch kept for manual rollback only.

name: Weekly Event Crawl

on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/crawl_events.py

      - name: Create issue with results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/crawl-report.md ]; then
            TITLE="[自動巡回] イベント情報更新レポート $(date +%Y-%m-%d)"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/crawl-report.md \
              --label "auto-crawl"
          fi
