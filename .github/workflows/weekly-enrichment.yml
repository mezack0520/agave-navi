name: Weekly Enrichment

# 統合元: enrich-events.yml + backfill-images.yml
# 毎週日曜 10:00 JST (01:00 UTC) に実行
# 1. Web検索 (Brave/Google) で各イベントの imageUrl / url / venue をエンリッチ
# 2. og:image から画像URLバックフィル
# 3. 全 static 再生成 + commit

on:
  schedule:
    - cron: '0 1 * * 0'
  # enrich-request.json の push で発火する。
  # repository_dispatch も workflow_dispatch もこのリポジトリでは送れない
  # (PATはActions APIで403 / ブラウザは認証ヘッダ遮断 / Web UIは別名義でログイン)。
  # したがって週次cron以外の起動手段はこのpushだけ。無いと積み残しを崩せない。
  # GITHUB_TOKEN のpushはワークフローを再起動しないので自己ループしない。
  push:
    branches: [main]
    paths:
      - 'enrich-request.json'
  repository_dispatch:
    types: [weekly-enrichment]
  workflow_dispatch:
    inputs:
      slug:
        description: '特定slugのみ (空欄=全件)'
        required: false
        default: ''
      limit:
        description: '件数上限 (0=全件)'
        required: false
        default: '20'
      remove_orphans:
        description: '公式情報なしを削除'
        type: boolean
        default: false

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Resolve parameters
        id: p
        env:
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_SLUG: ${{ github.event.inputs.slug }}
          IN_ORPH: ${{ github.event.inputs.remove_orphans }}
        run: |
          # 既定値は enrich-request.json。workflow_dispatch の入力があればそれで上書きする。
          # cron 実行もこのファイルを読むので、恒久的に件数を変えたいならファイルを直す。
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = {}
          try:
              with open('enrich-request.json', encoding='utf-8') as f:
                  cfg = json.load(f)
          except (OSError, ValueError):
              pass
          limit = str(os.environ.get('IN_LIMIT') or cfg.get('limit') or 20)
          slug = os.environ.get('IN_SLUG') or cfg.get('slug') or ''
          orph = (os.environ.get('IN_ORPH') == 'true') or bool(cfg.get('removeOrphans'))
          print(f'limit={limit}')
          print(f'slug={slug}')
          print(f'orphans={str(orph).lower()}')
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Run enrichment (Brave Search + scrape)
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          ARGS="--write-back"
          if [ "${{ steps.p.outputs.orphans }}" != "true" ]; then
            ARGS="$ARGS --no-remove"
          fi
          if [ -n "${{ steps.p.outputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ steps.p.outputs.slug }}"
          fi
          if [ "${{ steps.p.outputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ steps.p.outputs.limit }}"
          fi
          echo "enrich_events.py $ARGS"
          python3 scripts/enrich_events.py $ARGS || true

      - name: Backfill missing images (og:image)
        run: python3 scripts/backfill-images.py --upcoming-only || true

      - name: Regenerate all static files
        run: |
          bash scripts/build-all.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(weekly-enrichment): backfill imageUrl/url/venue + regen all"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "::warning::push failed attempt $attempt/5"
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then echo "::error::push failed"; exit 1; fi
          done

      - name: Create issue with enrichment report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/enrich-report.md ]; then
            gh label create "auto-enrich" --description "自動エンリッチメントレポート" --color "0E8A16" 2>/dev/null || true
            gh issue create \
              --title "[エンリッチメント週次] $(date +%Y-%m-%d)" \
              --body-file /tmp/enrich-report.md \
              --label "enhancement,auto-enrich" || true
          fi

      - name: Upload enrichment data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-data
          path: /tmp/enrich-data.json
          if-no-files-found: ignore
          retention-days: 30
