name: Weekly Enrichment

# 統合元: enrich-events.yml + backfill-images.yml
# 毎週日曜 10:00 JST (01:00 UTC) に実行
# 1. Web検索 (Brave/Google) で各イベントの imageUrl / url / venue をエンリッチ
# 2. og:image から画像URLバックフィル
# 3. 全 static 再生成 + commit

on:
  schedule:
    - cron: '0 1 * * 0'
  # enrich-request.json の push で発火する。
  # repository_dispatch も workflow_dispatch もこのリポジトリでは送れない
  # (PATはActions APIで403 / ブラウザは認証ヘッダ遮断 / Web UIは別名義でログイン)。
  # したがって週次cron以外の起動手段はこのpushだけ。無いと積み残しを崩せない。
  # GITHUB_TOKEN のpushはワークフローを再起動しないので自己ループしない。
  push:
    branches: [main]
    paths:
      - 'enrich-request.json'
  repository_dispatch:
    types: [weekly-enrichment]
  workflow_dispatch:
    inputs:
      slug:
        description: '特定slugのみ (空欄=全件)'
        required: false
        default: ''
      limit:
        description: '件数上限 (0=全件)'
        required: false
        default: '20'
      remove_orphans:
        description: '公式情報なしを削除'
        type: boolean
        default: false

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml pillow

      - name: Resolve parameters
        id: p
        env:
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_SLUG: ${{ github.event.inputs.slug }}
          IN_ORPH: ${{ github.event.inputs.remove_orphans }}
        run: |
          # 既定値は enrich-request.json。workflow_dispatch の入力があればそれで上書きする。
          # cron 実行もこのファイルを読むので、恒久的に件数を変えたいならファイルを直す。
          python3 scripts/enrich-params.py | tee -a "$GITHUB_OUTPUT"

      - name: Run enrichment (Brave Search + scrape)
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          ARGS="--write-back"
          if [ "${{ steps.p.outputs.orphans }}" != "true" ]; then
            ARGS="$ARGS --no-remove"
          fi
          if [ -n "${{ steps.p.outputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ steps.p.outputs.slug }}"
          fi
          if [ "${{ steps.p.outputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ steps.p.outputs.limit }}"
          fi
          echo "enrich_events.py $ARGS"
          python3 scripts/enrich_events.py $ARGS || true

      - name: Backfill missing images (og:image)
        run: python3 scripts/backfill-images.py --upcoming-only || true

      # Instagram の画像取得はここでは走らせない。
      # 2026-09-08 に試したところ、GitHub Actions のIPからは instagram.com が
      # 応答せず、30件すべてがタイムアウトして実行時間が5分→11分になり
      # 取得は0件だった(同じ回で backfill-images は非IGの4件を取れている)。
      # サンドボックスからも 403 で届かない。届くのは組み込みブラウザだけ。
      # scripts/fetch-event-images.py はブラウザを持つセッションから実行する。

      - name: Regenerate all static files
        run: |
          bash scripts/build-all.sh

      - name: Commit and push
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          bash scripts/ci-push.sh "chore(weekly-enrichment): backfill imageUrl/url/venue + regen all" "bash scripts/build-all.sh"

      # レポートはメールで送る。2026-09-25 まで Issue に出していたが、
      # 誰も読まず閉じもしない置き場だった。
      - name: Prepare enrichment mail
        id: mail
        if: always()
        run: |
          if [ -f /tmp/enrich-report.md ]; then
            cp /tmp/enrich-report.md enrich-mail.txt
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$(TZ=Asia/Tokyo date +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Send enrichment mail
        if: always() && steps.mail.outputs.exists == 'true'
        continue-on-error: true
        # health.yml と同じ SHA 固定(v3.11.0)
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【アガベイベント】週次補完レポート agave-navi ${{ steps.mail.outputs.today }}"
          to: yuji.mezaki@gmail.com
          from: "アガベイベントナビ <${{ secrets.GMAIL_USER }}>"
          body: file://enrich-mail.txt
