name: Weekly Enrichment

# 統合元: enrich-events.yml + backfill-images.yml
# 毎週日曜 10:00 JST (01:00 UTC) に実行
# 1. Web検索 (Brave/Google) で各イベントの imageUrl / url / venue をエンリッチ
# 2. og:image から画像URLバックフィル
# 3. 全 static 再生成 + commit

on:
  schedule:
    - cron: '0 1 * * 0'
  repository_dispatch:
    types: [weekly-enrichment]
  workflow_dispatch:
    inputs:
      slug:
        description: '特定slugのみ (空欄=全件)'
        required: false
        default: ''
      limit:
        description: '件数上限 (0=全件)'
        required: false
        default: '20'
      remove_orphans:
        description: '公式情報なしを削除'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run enrichment (Brave Search + scrape)
        env:
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:  ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          ARGS="--write-back"
          if [ "${{ github.event.inputs.remove_orphans }}" != "true" ]; then
            ARGS="$ARGS --no-remove"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python3 scripts/enrich_events.py $ARGS || true

      - name: Backfill missing images (og:image)
        run: python3 scripts/backfill-images.py || true

      - name: Regenerate all static files
        run: |
          python3 build-detail-pages.py
          python3 scripts/build-static-html.py
          python3 scripts/sync-index-cards.py
          python3 scripts/generate-rss.py
          python3 scripts/generate-itemlist-jsonld.py
          python3 scripts/generate-landing-pages.py
          python3 scripts/generate-ical.py
          python3 scripts/generate-csv.py
          python3 scripts/generate_sitemap.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(weekly-enrichment): backfill imageUrl/url/venue + regen all"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "::warning::push failed attempt $attempt/5"
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then echo "::error::push failed"; exit 1; fi
          done

      - name: Create issue with enrichment report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/enrich-report.md ]; then
            gh label create "auto-enrich" --description "自動エンリッチメントレポート" --color "0E8A16" 2>/dev/null || true
            gh issue create \
              --title "[エンリッチメント週次] $(date +%Y-%m-%d)" \
              --body-file /tmp/enrich-report.md \
              --label "enhancement,auto-enrich" || true
          fi

      - name: Upload enrichment data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-data
          path: /tmp/enrich-data.json
          if-no-files-found: ignore
          retention-days: 30
