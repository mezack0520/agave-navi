name: Health Check

# 統合元: event-check.yml + link-check.yml + image-health.yml + domain-check.yml + data-integrity.yml
# 毎日 11:00 JST (02:00 UTC) に全ヘルスチェック実行
# 1. データ整合性チェック (events.json)
# 2. 外部リンク生死監視 (link-check.sh)
# 3. 画像生死監視 + dead URL クリア (image-health-check.py)
# 4. SSL/ドメイン残日数
# 5. 各イベント詳細の生死 (check_events.py)
# 問題発見時のみ1件のIssueにまとめて通知

on:
  schedule:
    - cron: '0 0 * * *'  # 09:00 JST想定 (GitHub Actionsの遅延で実際は11:00 JST前後に着くことが多い)
  push:
    paths:
      - 'events.json'
  repository_dispatch:
    types: [health]
  workflow_dispatch:

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install requests

      - name: Set date (Asia/Tokyo)
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +'%Y/%m/%d')" >> $GITHUB_OUTPUT

      - name: Detect newly added events (last 24h)
        if: github.event_name != 'push'
        run: |
          python3 << 'PYEOF'
          import json, subprocess
          with open("events.json") as f:
              current = json.load(f)
          current_slugs = {e["slug"] for e in current}
          current_map = {e["slug"]: e for e in current}
          old_slugs = set()
          try:
              result = subprocess.run(
                  ["git", "log", "--since=24 hours ago", "--oneline", "--", "events.json"],
                  capture_output=True, text=True)
              commits = result.stdout.strip().split('\n')
              if commits and commits[0]:
                  oldest_hash = commits[-1].split()[0]
                  old_json = subprocess.check_output(
                      ["git", "show", f"{oldest_hash}~1:events.json"], stderr=subprocess.DEVNULL).decode()
                  old_slugs = {e["slug"] for e in json.loads(old_json)}
              else:
                  old_json = subprocess.check_output(
                      ["git", "show", "HEAD~1:events.json"], stderr=subprocess.DEVNULL).decode()
                  old_slugs = {e["slug"] for e in json.loads(old_json)}
          except Exception as ex:
              print(f"Warning: could not get previous events: {ex}")
              old_slugs = current_slugs
          added = current_slugs - old_slugs
          added_events = [current_map[s] for s in sorted(added) if s in current_map]
          output = {"count": len(added), "events": []}
          for e in added_events:
              output["events"].append({
                  "slug": e["slug"], "name": e.get("name", ""), "date": e.get("date", ""),
                  "dateEnd": e.get("dateEnd", ""), "location": e.get("location", ""),
                  "prefecture": e.get("prefecture", "")})
          with open("new-events-added.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"New events added (last 24h): {len(added)}")
          PYEOF

      - name: 1. Data integrity check
        id: integrity
        run: |
          python3 scripts/data-integrity-check.py --strict 2>&1 | tee /tmp/integrity.log || true
          ERR=$(grep -c "ERROR\|FAIL" /tmp/integrity.log || true)
          echo "errors=$ERR" >> $GITHUB_OUTPUT

      - name: 2. Link check (external URLs)
        id: linkcheck
        if: github.event_name != 'push'
        run: |
          bash scripts/check-links.sh 2>&1 | tee /tmp/links.log || true
          BROKEN=$(grep -c "BROKEN\|404\|FAIL" /tmp/links.log || true)
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT

      - name: 3. Image health (clear dead imageUrls)
        id: imghealth
        if: github.event_name != 'push'
        run: |
          python3 scripts/image-health-check.py 2>&1 | tee /tmp/img.log || true
          DEAD=$(grep -c "dead\|404" /tmp/img.log || true)
          echo "dead=$DEAD" >> $GITHUB_OUTPUT

          # If events.json changed, regen detail pages + sync index
          if ! git diff --quiet events.json; then
            python3 build-detail-pages.py
            python3 scripts/sync-index-cards.py
            # 終了30日超に入った回は build-detail-pages.py で noindex になるが、
            # sitemap を作り直さないと翌朝の daily まで載り続ける(2026-08-04に4件)。
            python3 scripts/generate_sitemap.py
          fi

      - name: 4. Domain/SSL check
        id: domain
        if: github.event_name != 'push'
        run: |
          DOMAIN="agave-navi.com"
          EXPIRY=$(echo | openssl s_client -servername $DOMAIN -connect $DOMAIN:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$EXPIRY" ]; then
            EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null)
            DAYS_LEFT=$(( ($EXPIRY_EPOCH - $(date +%s)) / 86400 ))
            echo "ssl_days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT
            echo "SSL: $DAYS_LEFT days left"
          else
            echo "ssl_days_left=0" >> $GITHUB_OUTPUT
          fi

      - name: 5. Event detail page checks
        id: eventcheck
        if: github.event_name != 'push'
        run: python3 scripts/check_events.py 2>&1 | tee /tmp/events.log || true

      - name: Build daily email body
        id: emailbody
        if: github.event_name != 'push'
        run: |
          if [ -f check-results.json ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
            python3 << 'PYEOF'
          import json
          from datetime import date
          with open('check-results.json') as f:
              data = json.load(f)
          new_added = {"count": 0, "events": []}
          try:
              with open('new-events-added.json') as f:
                  new_added = json.load(f)
          except Exception:
              pass
          today = date.today().strftime('%Y/%m/%d')
          # 要人間判断キュー(各スケジュールタスクが積む)を読み込み
          judgments = []
          try:
              with open('pending-judgments.json') as f:
                  judgments = json.load(f).get('items', [])
          except Exception:
              pass
          # 整合監査(audit.py)の結果。検出があれば要修正。
          audit = {}
          try:
              with open('audit-results.json') as f:
                  audit = json.load(f)
          except Exception:
              pass
          lines = []
          lines.append("【アガベイベントナビ】イベント定期チェック結果")
          lines.append(f"チェック日: {today}")
          if judgments:
              lines.append("")
              lines.append(f"━━━ 🙋 あなたの判断が必要です（{len(judgments)}件）━━━")
              for j in judgments:
                  lines.append(f"■ [{j.get('source','?')}] {j.get('title','')} ({j.get('date','')})")
                  if j.get('detail'):
                      lines.append(f"  {j['detail']}")
                  if j.get('proposal'):
                      lines.append(f"  → 提案: {j['proposal']}")
                  lines.append("")
              lines.append("対応はCoworkでClaudeに指示してください（例:「キューの◯◯を承認」）。対応済みの項目は各タスクが自動で消し込みます。")
              lines.append("")
          lines.append("")
          lines.append("━━━ サマリー ━━━")
          lines.append(f"総イベント数: {data['total_events']}")
          today_events = data.get('today_events', [])
          lines.append(f"🎪 本日開催中: {len(today_events)}")
          lines.append(f"🆕 本日追加: {new_added['count']}件")
          lines.append(f"今後のイベント: {len(data['upcoming_events'])}")
          lines.append(f"終了済み: {len(data['past_events'])}")
          lines.append(f"詳細未定(TBD): {len(data['tbd_events'])}")
          lines.append(f"✍️ 説明文70字未満(開催予定): {len(data.get('short_descriptions') or [])}件")
          lines.append(f"👀 IGハンドル未解決(ウォッチ対象外): {len(data.get('unresolved_ig') or [])}件")
          # 出す項目は audit.py 側の severity で決まる。ここに項目名を書かない。
          _af = (audit.get('findings') or {})
          _hit = [(k, v) for k, v in _af.items()
                  if v.get('severity', 'urgent') == 'urgent' and v.get('count')]
          if _hit:
              lines.append("")
              lines.append("━━━ 🔧 整合監査：要修正 ━━━")
              for _k, _v in _hit:
                  lines.append(f"・{_v.get('title', _k)}: {_v.get('count')}件")
                  for _it in (_v.get('items') or [])[:5]:
                      lines.append(f"    - {_it}")
                  if _v.get('note'):
                      lines.append(f"    → {_v['note']}")
          else:
              lines.append("🔧 整合監査：異常なし")
          _info = [(k, v) for k, v in _af.items()
                   if v.get('severity') == 'info' and v.get('count')]
          # metric は構造上ゼロにならない観測値。減らす対象と同じ枠に置くと
          # 一覧が常に埋まり、読み手が一覧ごと無視するようになる(2026-08-24に分離)
          _metric = [(k, v) for k, v in _af.items()
                     if v.get('severity') == 'metric' and v.get('count')]
          if _info:
              lines.append("")
              lines.append("━━━ 📊 積み残し（急がないが減らしたい） ━━━")
              for _k, _v in _info:
                  lines.append(f"・{_v.get('title', _k)}: {_v.get('count')}件")
          # 件数はURL単位。同じ出典を共有する回が並ぶため、イベント単位だと実体1件が7件に見える
          _dead_u = sorted({d['sourceUrl'] for d in data['dead_links']})
          _unreach_u = sorted({d['sourceUrl'] for d in (data.get('unreachable') or [])})
          if _dead_u:
              lines.append(f"・リンク切れ(サーバが4xx/5xxを返した): {len(_dead_u)}URL")
          if _unreach_u:
              lines.append(f"・出典に接続できない(相手が生きている可能性が高い。要確認): {len(_unreach_u)}URL")
          if _metric:
              lines.append("")
              lines.append("━━━ 参考値（構造上ゼロにはならない。対応不要） ━━━")
              for _k, _v in _metric:
                  lines.append(f"・{_v.get('title', _k)}: {_v.get('count')}件")
          lines.append("")
          lines.append("━━━ ✅ 毎日の自動チェック ━━━")
          lines.append(f"要判断キュー: {len(judgments)}件 / 内容異常の検知: {len(data.get('implausible') or [])}件 / リンク切れ: {len(_dead_u)}URL / 詳細未定: {len(data['tbd_events'])}件")
          lines.append("※いずれも0件なら対応不要です。1件以上ある項目だけ、下に内訳が出ます。")
          lines.append("")
          if new_added['count'] > 0:
              lines.append(f"━━━ 🆕 本日追加イベント（{new_added['count']}件） ━━━")
              for ne in new_added['events']:
                  end_info = f"〜{ne['dateEnd']}" if ne.get('dateEnd') else ''
                  lines.append(f"・{ne['name']}")
                  lines.append(f"  日時: {ne['date']}{end_info}")
                  lines.append(f"  場所: {ne.get('prefecture', '')} {ne.get('location', '')}")
                  lines.append(f"  URL: https://agave-navi.com/events/{ne['slug']}.html")
                  lines.append("")
          if today_events:
              lines.append("━━━ 🎪 本日開催中！ ━━━")
              for te in today_events:
                  end_info = f"〜{te['dateEnd']}" if te.get('dateEnd') and te['dateEnd'] != te['date'] else ''
                  lines.append(f"・{te['name']}")
                  lines.append(f"  日時: {te['date']}{end_info}")
                  lines.append(f"  場所: {te['location']}")
                  lines.append(f"  URL: https://agave-navi.com/events/{te['slug']}.html")
                  lines.append("")
          if data['dead_links']:
              lines.append("━━━ ⚠️ リンク切れ検出 ━━━")
              _g = {}
              for dl in data['dead_links']:
                  _g.setdefault((dl['sourceUrl'], dl['statusCode']), []).append(dl)
              for (_u, _c), _evs in sorted(_g.items()):
                  lines.append(f"・HTTP {_c} {_u}")
                  lines.append(f"  該当 {len(_evs)}件: " + '、'.join(e['name'] for e in _evs[:4])
                               + ('…' if len(_evs) > 4 else ''))
                  lines.append(f"  例: https://agave-navi.com/events/{_evs[0]['slug']}.html")
                  lines.append("")
          if data.get('unreachable'):
              lines.append("━━━ 出典に接続できなかった（判定不能） ━━━")
              lines.append("HTTPの応答自体が取れていないので、リンク切れとは限りません。")
              lines.append("ブラウザで開いて生きていれば、こちらの取得手段の問題です。")
              _g2 = {}
              for dl in data['unreachable']:
                  _g2.setdefault(dl['sourceUrl'], []).append(dl)
              for _u, _evs in sorted(_g2.items()):
                  lines.append(f"・{_u} ← {len(_evs)}件")
              lines.append("")
          if data.get('implausible'):
              lines.append("━━━ 🧪 内容の異常を自動検知（要確認） ━━━")
              for ip in data['implausible']:
                  lines.append(f"・{ip['name']}")
                  for iss in ip['issues']:
                      lines.append(f"  - {iss}")
                  lines.append(f"  詳細: https://agave-navi.com/events/{ip['slug']}.html")
                  lines.append("")
          if data['tbd_events']:
              lines.append("━━━ 📋 詳細未定イベント（要確認） ━━━")
              for tbd in data['tbd_events']:
                  lines.append(f"・{tbd['name']} ({tbd['date']})")
                  lines.append(f"  ソース: {tbd['sourceUrl']}")
                  lines.append("")
          if data['upcoming_events']:
              lines.append("━━━ 📅 今後のイベント一覧 ━━━")
              for ue in sorted(data['upcoming_events'], key=lambda x: x['date']):
                  status_label = '✅' if ue['eventStatus'] == 'confirmed' else '⏳'
                  end = f"〜{ue['dateEnd']}" if ue.get('dateEnd') else ''
                  lines.append(f"{status_label} {ue['name']}")
                  lines.append(f"   日時: {ue['date']}{end}")
                  lines.append(f"   場所: {ue['location']}")
                  lines.append(f"   URL: https://agave-navi.com/events/{ue['slug']}.html")
                  lines.append("")
          lines.append("━━━━━━━━━━━━━━━━━━━━")
          lines.append("アガベイベントナビ https://agave-navi.com")
          with open('email-body.txt', 'w') as f:
              f.write('\n'.join(lines))
          subj_prefix = f"【要判断{len(judgments)}件】" if judgments else ""
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"subj_prefix={subj_prefix}\n")
          print('\n'.join(lines))
          PYEOF
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Send daily email
        if: github.event_name != 'push' && steps.emailbody.outputs.results_exist == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.emailbody.outputs.subj_prefix }}【アガベイベント】定期チェック結果 agave-navi ${{ steps.date.outputs.today }}"
          to: yuji.mezaki@gmail.com
          from: "アガベイベントナビ <${{ secrets.GMAIL_USER }}>"
          body: file://email-body.txt

      - name: Commit any auto-cleaned changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(health): auto cleanup [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase || true
            sleep $((RANDOM % 5 + 2))
            if [ $attempt -eq 5 ]; then exit 1; fi
          done

      - name: Aggregate report → single Issue (only if problems)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INTEGRITY_ERR=${{ steps.integrity.outputs.errors || 0 }}
          LINKS_BROKEN=${{ steps.linkcheck.outputs.broken || 0 }}
          IMAGES_DEAD=${{ steps.imghealth.outputs.dead || 0 }}
          SSL_DAYS=${{ steps.domain.outputs.ssl_days_left || 999 }}

          PROBLEMS=$((INTEGRITY_ERR + LINKS_BROKEN + IMAGES_DEAD))
          SSL_ALERT=""
          if [ "$SSL_DAYS" -lt 30 ]; then SSL_ALERT="⚠️ SSL残${SSL_DAYS}日"; PROBLEMS=$((PROBLEMS+1)); fi

          if [ "$PROBLEMS" -eq 0 ]; then
            echo "All health checks passed. No issue needed."
            exit 0
          fi

          cat > /tmp/health-report.md <<EOF
          ## 健全性レポート $(date +%Y-%m-%d)

          | 項目 | 状態 |
          |---|---|
          | データ整合性エラー | ${INTEGRITY_ERR}件 |
          | リンク切れ | ${LINKS_BROKEN}件 |
          | 画像URL死亡 | ${IMAGES_DEAD}件 |
          | SSL残日数 | ${SSL_DAYS}日 ${SSL_ALERT} |

          ### 詳細ログ
          <details><summary>data integrity</summary>

          \`\`\`
          $(tail -30 /tmp/integrity.log 2>/dev/null)
          \`\`\`
          </details>
          <details><summary>links</summary>

          \`\`\`
          $(tail -20 /tmp/links.log 2>/dev/null)
          \`\`\`
          </details>
          <details><summary>images</summary>

          \`\`\`
          $(tail -20 /tmp/img.log 2>/dev/null)
          \`\`\`
          </details>
          <details><summary>events</summary>

          \`\`\`
          $(tail -20 /tmp/events.log 2>/dev/null)
          \`\`\`
          </details>
          EOF

          gh label create "auto-health" --description "自動健全性レポート" --color "F4A261" 2>/dev/null || true
          gh issue create \
            --title "🩺 健全性レポート $(date +%Y-%m-%d) (${PROBLEMS}件)" \
            --body-file /tmp/health-report.md \
            --label "auto-health" || true
