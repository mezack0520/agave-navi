name: Health Check

# 統合元: event-check.yml + link-check.yml + image-health.yml + domain-check.yml + data-integrity.yml
# 朝の最後のタスク(event-monitor)の合図 mail-request.json の push で全ヘルスチェックとメール(08時台)
# 1. データ整合性チェック (events.json)
# 2. 画像生死監視 + dead URL クリア (image-health-check.py)
# 3. 作り直して監査し直す (build-all.sh。メールの「残っていること」はこの監査)
# 4. SSL/ドメイン残日数
# 5. 各イベント詳細の生死 (check_events.py)
# 結果はメールで送る。判断・反映・残った異常が無い日は送らない(2026-09-30)。Issue は 2026-09-25 に廃止

on:
  schedule:
    # 保険(2026-10-06)。メールは朝の最後のタスク(event-monitor)が
    # mail-request.json を push して起こす(scripts/request-run.py mail)。PC が止まっていて
    # 合図が来なかった日だけ、この回が送る(その日に送り済みなら送らない。build-health-mail.py)。
    # GitHub の schedule は遅れも抜けもある: 00:00 指定が 11時台、03:00 指定が
    # 18〜19時台に走り、10/5・10/6 は1回も走らなかった。時刻は当てにしない。
    - cron: '0 0 * * *'
  push:
    paths:
      - 'events.json'
      # 朝の最後のタスク(event-monitor)が書いて push する「メールを組んで送って」の合図
      # (2026-10-06)。schedule は遅れも抜けもある(10/5 は1回も走らなかった)。
      # workflow_dispatch はタスクの PAT に Actions 権限が無く 403 なので、push で起こす
      - 'mail-request.json'
  repository_dispatch:
    types: [health]
  workflow_dispatch:

concurrency:
  group: events-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # 全部のチェックとメールを回す回か。schedule / dispatch と、mail-request.json を
      # 含む push。events.json だけの push は整合性チェックだけ
      - name: Decide mode
        id: mode
        run: |
          FULL=false
          if [ "${{ github.event_name }}" != "push" ]; then FULL=true
          elif git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qx 'mail-request.json'; then FULL=true; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "full=$FULL"

      - name: Install deps
        run: pip install requests

      - name: Detect newly added events (last 24h)
        if: steps.mode.outputs.full == 'true'
        run: python3 scripts/detect-added-events.py

      - name: 1. Data integrity check
        id: integrity
        run: |
          python3 scripts/data-integrity-check.py --strict 2>&1 | tee /tmp/integrity.log || true
          ERR=$(grep -c "ERROR\|FAIL" /tmp/integrity.log || true)
          echo "errors=$ERR" >> $GITHUB_OUTPUT

      - name: 2. Image health (clear dead imageUrls)
        if: steps.mode.outputs.full == 'true'
        # 死んだ imageUrl は自分で外す(直す側の処理)。件数をメールに載せる理由は無い。
        # 外した回の頁は次の作り直しが反映する
        run: python3 scripts/image-health-check.py || true

      # メールは audit-results.json を読む。合図の push に載っているのはタスクが手元で
      # 回した監査で、生成物は CI が作り直すため、タスクが直した回の頁はその時点では古い。
      # それを読むと、直後の daily が作り直せば消える不一致を「直せずに残っている」と
      # 送る(2026-10-20 king-plants の index_card_body_drift)。送る前に作り直して監査し直す。
      # 落ちてもメールは止めない。落ちたことはメールの先頭に出る(build-health-mail.py)
      - name: 3. Rebuild and re-audit
        id: rebuild
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/build-all.sh 2>&1 | tee /tmp/build.log

      - name: 4. Domain/SSL check
        id: domain
        if: steps.mode.outputs.full == 'true'
        run: |
          DOMAIN="agave-navi.com"
          EXPIRY=$(echo | openssl s_client -servername $DOMAIN -connect $DOMAIN:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$EXPIRY" ]; then
            EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null)
            DAYS_LEFT=$(( ($EXPIRY_EPOCH - $(date +%s)) / 86400 ))
            echo "ssl_days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT
            echo "SSL: $DAYS_LEFT days left"
          else
            echo "ssl_days_left=0" >> $GITHUB_OUTPUT
          fi

      - name: 5. Event detail page checks
        if: steps.mode.outputs.full == 'true'
        # 結果は check-results.json に出て build-health-mail.py が読む。
        # リンク切れがあると exit 1 なので || true は要る
        run: python3 scripts/check_events.py || true

      - name: Build daily email body
        id: emailbody
        env:
          INTEGRITY_ERR: ${{ steps.integrity.outputs.errors || 0 }}
          SSL_DAYS: ${{ steps.domain.outputs.ssl_days_left || 999 }}
          MAIL_RUN: ${{ steps.mode.outputs.full }}
          BUILD_RESULT: ${{ steps.rebuild.outcome }}
        run: |
          if [ -f check-results.json ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
            python3 scripts/build-health-mail.py
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi
      - name: Send daily email
        # 判断・反映・残った異常のどれも無い日は送らない(build-health-mail.py の冒頭)
        if: steps.mode.outputs.full == 'true' && steps.emailbody.outputs.results_exist == 'true' && steps.emailbody.outputs.send == 'true'
        continue-on-error: true
        # 第三者のactionはSHAで固定する。タグは動かせるので、v3 のままだと
        # 相手のリポジトリが乗っ取られた日に GMAIL_APP_PASSWORD が渡る。
        # 4226df7daafa6fc901a43789c49bf7ab309066e7 = v3.11.0 (2026-09-10 時点の v3)
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.emailbody.outputs.subject }}"
          to: yuji.mezaki@gmail.com
          from: "アガベイベントナビ <${{ secrets.GMAIL_USER }}>"
          body: file://email-body.txt

      - name: Commit any auto-cleaned changes
        run: |
          # push は scripts/ci-push.sh に集約(2026-09-07)。生成物を含むコミットで
          # rebase を使うと必ず衝突し、`|| true` が握り潰して detached HEAD に残り、
          # 以後の再試行が全て失敗していた(daily #160)。詳細はスクリプト冒頭。
          # 3 で作り直した生成物も載るので、拒否されたら remote の版で作り直して押し直す
          bash scripts/ci-push.sh "chore(health): auto cleanup [skip ci]" "bash scripts/build-all.sh"
