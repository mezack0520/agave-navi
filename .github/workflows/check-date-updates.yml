# [DEPRECATED] This workflow has been consolidated into one of:
#   - daily.yml / weekly-enrichment.yml / weekly-discovery.yml / health.yml
# Cron trigger removed; workflow_dispatch kept for manual rollback only.

name: Check Event Date Updates

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  check-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check date updates
        id: check
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="--slug ${{ github.event.inputs.slug }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/check_date_updates.py $ARGS

      - name: Rebuild detail pages (also regenerate static HTML)
        if: github.event.inputs.dry_run != 'true'
        run: |
          bash scripts/build-all.sh || true

      - name: Commit changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json events/ index.html map.html calendar.html sitemap.xml rss.xml events.csv events.ics this-month.ics upcoming.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update event dates from official sources"
            # Robust push with rebase+retry to avoid concurrent-push races
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "::warning::push failed (attempt $attempt/5); pulling --rebase and retrying..."
              git pull --rebase || true
              sleep $((RANDOM % 5 + 2))
              if [ $attempt -eq 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
            done
          fi
