name: Check Event Date Updates

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      slug:
        description: '特定イベントのslug（空欄で全件）'
        required: false
        default: ''
      dry_run:
        description: 'dry-run（確認のみ）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check date updates
        id: check
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="--slug ${{ github.event.inputs.slug }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/check_date_updates.py $ARGS

      - name: Rebuild detail pages (also regenerate static HTML)
        if: github.event.inputs.dry_run != 'true'
        run: |
          python3 build-detail-pages.py || true
          python3 scripts/build-static-html.py || true
          python3 scripts/sync-index-cards.py || true
          python3 scripts/generate-rss.py || true
          python3 scripts/generate-itemlist-jsonld.py || true
          python3 scripts/generate-landing-pages.py || true
          python3 scripts/generate-ical.py || true
          python3 scripts/generate-csv.py || true
          python3 scripts/generate_sitemap.py || true

      - name: Commit changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json events/ index.html map.html calendar.html sitemap.xml rss.xml itemlist.json *.csv *.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update event dates from official sources"
            # Robust push with rebase+retry to avoid concurrent-push races
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "::warning::push failed (attempt $attempt/5); pulling --rebase and retrying..."
              git pull --rebase || true
              sleep $((RANDOM % 5 + 2))
              if [ $attempt -eq 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
            done
          fi
