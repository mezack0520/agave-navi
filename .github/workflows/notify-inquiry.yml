# 問い合わせ受け渡し箱の見張り
#
# **このワークフローは問い合わせ通知メールを送らない。**(2026-09-07)
# 以前は new-inquiries.json の push で「新着N件」を送っていたが、
# 同じ1件について GAS も「申請者の連絡先」を送るため、毎回2通届いていた
# (18:41 連絡先 / 18:42 新着1件)。
#
# 1通に寄せる先は GAS 側。理由は連絡先の置き場所で決まる:
#   - 申請者の氏名・メールアドレスはリポジトリに書けない。agave-navi は
#     public で、new-inquiries.json は https://agave-navi.com/new-inquiries.json
#     として誰でも読める(listing-policy.json の inquiryPii)。
#   - このワークフローの入力はその public なファイルなので、
#     連絡先を本文に入れる手段が無い。Actions のログも public に見える。
#   - GAS はフォーム送信時に連絡先を手元に持っている。だから
#     「本文も連絡先も入った1通」を出せるのは GAS だけ。
# したがって通知の送信元は scripts/google-apps-script.js の notify() 一箇所。
#
# ここに残しているのは、GAS では気づけない repo 側の壊れ方だけ。
# new-inquiries.json が JSON として読めなくなると、event-listing-review が
# 受け渡し箱を読めず、問い合わせが黙って滞留する。それだけを知らせる。
name: Notify Inquiry

on:
  push:
    branches: [main]
    paths:
      - 'new-inquiries.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check handoff file is readable
        id: check
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib

          broken = ''
          p = pathlib.Path('new-inquiries.json')
          if not p.exists():
              broken = 'new-inquiries.json が存在しません'
          else:
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
                  if not isinstance(d.get('items', []), list):
                      broken = 'items が配列ではありません'
              except Exception as e:
                  broken = f'JSONとして読めません: {e}'

          print('broken=' + ('true' if broken else 'false'))
          print('reason=' + broken.replace('\n', ' '))
          PY

      - name: Alert on broken handoff file
        if: steps.check.outputs.broken == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【アガベイベントナビ】受け渡し箱が壊れています"
          to: yuji.mezaki@gmail.com
          from: "アガベイベントナビ <${{ secrets.GMAIL_USER }}>"
          body: |
            new-inquiries.json が読めない状態です。
            このままだと event-listing-review が問い合わせを読めず、黙って滞留します。

            理由: ${{ steps.check.outputs.reason }}

            回答シート:
            https://docs.google.com/spreadsheets/d/1iTWAAbd5FV4NkNyt186H8wR6KqTPOLcFWSvHghZMDvI/edit
