name: Event Check & Notify

on:
  schedule:
    # 毎朝9時（JST = UTC 0:00）に実行（8時の巡回結果を含めるため）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  check-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set date variable
        id: date
        run: |
          echo "today=$(TZ=Asia/Tokyo date +'%Y/%m/%d')" >> $GITHUB_OUTPUT

      - name: Count recently added events
        id: new_events
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          # Get current events
          with open("events.json") as f:
              current = json.load(f)
          current_slugs = {e["slug"] for e in current}
          current_map = {e["slug"]: e for e in current}

          # Try to get yesterday's events from git (compare against ~24h ago)
          old_slugs = set()
          try:
              # Find the commit from before the last sync-events run
              result = subprocess.run(
                  ["git", "log", "--since=24 hours ago", "--oneline", "--", "events.json"],
                  capture_output=True, text=True
              )
              commits = result.stdout.strip().split('\n')
              if commits and commits[0]:
                  # Get the state BEFORE the oldest recent commit
                  oldest_hash = commits[-1].split()[0]
                  old_json = subprocess.check_output(
                      ["git", "show", f"{oldest_hash}~1:events.json"],
                      stderr=subprocess.DEVNULL
                  ).decode()
                  old_slugs = {e["slug"] for e in json.loads(old_json)}
              else:
                  # No changes in 24h, compare with HEAD~1
                  old_json = subprocess.check_output(
                      ["git", "show", "HEAD~1:events.json"],
                      stderr=subprocess.DEVNULL
                  ).decode()
                  old_slugs = {e["slug"] for e in json.loads(old_json)}
          except Exception as ex:
              print(f"Warning: Could not get previous events: {ex}")
              old_slugs = current_slugs  # No diff if we can't compare

          added = current_slugs - old_slugs
          added_events = [current_map[s] for s in sorted(added) if s in current_map]

          output = {"count": len(added), "events": []}
          for e in added_events:
              output["events"].append({
                  "slug": e["slug"],
                  "name": e.get("name", ""),
                  "date": e.get("date", ""),
                  "dateEnd": e.get("dateEnd", ""),
                  "location": e.get("location", ""),
                  "prefecture": e.get("prefecture", "")
              })

          with open("new-events-added.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"count={len(added)}\n")

          print(f"New events added (last 24h): {len(added)}")
          for e in added_events:
              print(f"  - {e.get('name', e['slug'])}")
          PYEOF

      - name: Run event check script
        id: check
        continue-on-error: true
        run: python scripts/check_events.py

      - name: Read check results
        id: results
        run: |
          if [ -f check-results.json ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT

            # Extract counts
            DEAD=$(python3 -c "import json; d=json.load(open('check-results.json')); print(len(d['dead_links']))")
            TBD=$(python3 -c "import json; d=json.load(open('check-results.json')); print(len(d['tbd_events']))")
            PAST=$(python3 -c "import json; d=json.load(open('check-results.json')); print(len(d['past_events']))")
            UPCOMING=$(python3 -c "import json; d=json.load(open('check-results.json')); print(len(d['upcoming_events']))")
            TOTAL=$(python3 -c "import json; d=json.load(open('check-results.json')); print(d['total_events'])")

            echo "dead_links=$DEAD" >> $GITHUB_OUTPUT
            echo "tbd_count=$TBD" >> $GITHUB_OUTPUT
            echo "past_count=$PAST" >> $GITHUB_OUTPUT
            echo "upcoming_count=$UPCOMING" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            # Build email body
            python3 << 'PYEOF'
          import json
          from datetime import date

          with open('check-results.json') as f:
              data = json.load(f)

          # Load new events added info
          new_added = {"count": 0, "events": []}
          try:
              with open('new-events-added.json') as f:
                  new_added = json.load(f)
          except:
              pass

          today = date.today().strftime('%Y/%m/%d')
          lines = []
          lines.append(f"【アガベイベントナビ】イベント定期チェック結果")
          lines.append(f"チェック日: {today}")
          lines.append(f"")
          lines.append(f"━━━ サマリー ━━━")
          lines.append(f"総イベント数: {data['total_events']}")

          today_events = data.get('today_events', [])
          lines.append(f"🎪 本日開催中: {len(today_events)}")
          lines.append(f"🆕 本日追加: {new_added['count']}件")
          lines.append(f"今後のイベント: {len(data['upcoming_events'])}")
          lines.append(f"終了済み: {len(data['past_events'])}")
          lines.append(f"詳細未定(TBD): {len(data['tbd_events'])}")
          lines.append(f"リンク切れ: {len(data['dead_links'])}")
          lines.append(f"")

          has_updates = False

          # New events added section
          if new_added['count'] > 0:
              has_updates = True
              lines.append(f"━━━ 🆕 本日追加イベント（{new_added['count']}件） ━━━")
              for ne in new_added['events']:
                  end_info = f"〜{ne['dateEnd']}" if ne.get('dateEnd') else ''
                  lines.append(f"・{ne['name']}")
                  lines.append(f"  日時: {ne['date']}{end_info}")
                  lines.append(f"  場所: {ne.get('prefecture', '')} {ne.get('location', '')}")
                  lines.append(f"  URL: https://agave-navi.com/events/{ne['slug']}.html")
                  lines.append(f"")

          if today_events:
              has_updates = True
              lines.append(f"━━━ 🎪 本日開催中！ ━━━")
              for te in today_events:
                  end_info = f"〜{te['dateEnd']}" if te.get('dateEnd') and te['dateEnd'] != te['date'] else ''
                  lines.append(f"・{te['name']}")
                  lines.append(f"  日時: {te['date']}{end_info}")
                  lines.append(f"  場所: {te['location']}")
                  lines.append(f"  URL: https://agave-navi.com/events/{te['slug']}.html")
                  lines.append(f"")

          if data['dead_links']:
              has_updates = True
              lines.append(f"━━━ ⚠️ リンク切れ検出 ━━━")
              for dl in data['dead_links']:
                  lines.append(f"・{dl['name']}")
                  lines.append(f"  URL: {dl['sourceUrl']}")
                  lines.append(f"  ステータス: HTTP {dl['statusCode']}")
                  lines.append(f"  詳細: https://agave-navi.com/events/{dl['slug']}.html")
                  lines.append(f"")

          if data['tbd_events']:
              has_updates = True
              lines.append(f"━━━ 📋 詳細未定イベント（要確認） ━━━")
              for tbd in data['tbd_events']:
                  lines.append(f"・{tbd['name']} ({tbd['date']})")
                  lines.append(f"  ソース: {tbd['sourceUrl']}")
                  lines.append(f"")

          if data['past_events']:
              has_updates = True
              lines.append(f"━━━ 🕐 終了済みイベント（アーカイブ検討） ━━━")
              for pe in data['past_events']:
                  end = pe.get('dateEnd', pe['date'])
                  lines.append(f"・{pe['name']} ({pe['date']}〜{end})")
              lines.append(f"")

          if data['upcoming_events']:
              lines.append(f"━━━ 📅 今後のイベント一覧 ━━━")
              for ue in sorted(data['upcoming_events'], key=lambda x: x['date']):
                  status_label = '✅' if ue['eventStatus'] == 'confirmed' else '⏳'
                  end = f"〜{ue['dateEnd']}" if ue.get('dateEnd') else ''
                  lines.append(f"{status_label} {ue['name']}")
                  lines.append(f"   日時: {ue['date']}{end}")
                  lines.append(f"   場所: {ue['location']}")
                  lines.append(f"   URL: https://agave-navi.com/events/{ue['slug']}.html")
                  lines.append(f"")

          lines.append(f"━━━━━━━━━━━━━━━━━━━━")
          lines.append(f"アガベイベントナビ https://agave-navi.com")

          body = '\n'.join(lines)

          # Write to file for email step
          with open('email-body.txt', 'w') as f:
              f.write(body)

          # Write has_updates flag
          with open('has-updates.txt', 'w') as f:
              f.write('true' if has_updates else 'false')

          print(body)
          PYEOF
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: steps.results.outputs.results_exist == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【アガベイベント】定期チェック結果 agave-navi ${{ steps.date.outputs.today }}"
          to: yuji.mezaki@gmail.com
          from: "アガベイベントナビ <${{ secrets.GMAIL_USER }}>"
          body: file://email-body.txt

      - name: Print results (fallback if email not configured)
        if: steps.results.outputs.results_exist == 'true'
        run: |
          echo "=== チェック結果 ==="
          cat email-body.txt

      - name: Create issue if problems found
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('check-results.json', 'utf8'));
            const today = new Date().toISOString().split('T')[0];

            let body = `## イベントチェック結果 (${today})\n\n`;

            if (data.dead_links.length > 0) {
              body += `### ⚠️ リンク切れ (${data.dead_links.length}件)\n\n`;
              data.dead_links.forEach(dl => {
                body += `- **${dl.name}**: [${dl.sourceUrl}](${dl.sourceUrl}) → HTTP ${dl.statusCode}\n`;
              });
              body += '\n';
            }

            if (data.tbd_events.length > 0) {
              body += `### 📋 詳細未定イベント (${data.tbd_events.length}件)\n\n`;
              data.tbd_events.forEach(tbd => {
                body += `- **${tbd.name}** (${tbd.date}) → [確認する](${tbd.sourceUrl})\n`;
              });
              body += '\n';
            }

            body += `\n---\n_自動生成 by event-check workflow_`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 イベントチェック: ${data.dead_links.length}件のリンク切れ検出 (${today})`,
              body: body,
              labels: ['event-check', 'automated']
            });

      - name: Cleanup check results
        run: |
          rm -f check-results.json email-body.txt has-updates.txt new-events-added.json
