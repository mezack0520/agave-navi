name: Generate Missing Event Pages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate missing event pages
        run: python scripts/generate_missing_pages_v2.py
      
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events/*.html
          git diff --cached --quiet || git commit -m "feat: regenerate event detail pages with proper template"
          git push
