name: Generate Missing Event Pages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate missing event pages
        run: |
          python3 << 'PYEOF'
          import json, os, re

          with open('events.json', 'r', encoding='utf-8') as f:
              events = json.load(f)

          with open('index.html', 'r', encoding='utf-8') as f:
              index_html = f.read()

          # Find a template from an existing event page
          template_file = None
          for fn in os.listdir('events'):
              if fn.endswith('.html'):
                  template_file = os.path.join('events', fn)
                  break

          if not template_file:
              print('No template file found')
              exit(1)

          with open(template_file, 'r', encoding='utf-8') as f:
              template = f.read()

          # Extract template event info for replacement
          tpl_slug = os.path.basename(template_file).replace('.html', '')
          tpl_event = None
          for e in events:
              if e['slug'] == tpl_slug:
                  tpl_event = e
                  break

          if not tpl_event:
              print(f'Template event {tpl_slug} not found in events.json')
              exit(1)

          # Get all slugs that have cards in index.html but no HTML file
          existing_files = set(fn.replace('.html', '') for fn in os.listdir('events') if fn.endswith('.html'))
          card_slugs = re.findall(r'data-slug="([^"]+)"', index_html)
          missing_slugs = [s for s in card_slugs if s not in existing_files]
          print(f'Missing slugs: {len(missing_slugs)}')

          def get_card_data(slug):
              pos = index_html.find(f'data-slug="{slug}"')
              if pos < 0:
                  return None
              chunk = index_html[pos:pos+2500]
              texts = re.findall(r'>([^<]+)<', chunk)
              texts = [t.strip() for t in texts if t.strip() and t.strip() not in ['', '\n']]
              card_start = index_html.rfind('<div class="event-card"', 0, pos)
              attr_chunk = index_html[card_start:pos+len(slug)+2]
              date = re.search(r'data-date="([^"]+)"', attr_chunk)
              date_end = re.search(r'data-date-end="([^"]+)"', attr_chunk)
              pref = re.search(r'data-pref="([^"]+)"', attr_chunk)
              tags = re.search(r'data-tags="([^"]+)"', attr_chunk)
              return {
                  'slug': slug,
                  'name': texts[1] if len(texts) > 1 else slug,
                  'date': date.group(1) if date else '',
                  'dateEnd': date_end.group(1) if date_end else '',
                  'dateDisplay': texts[0] if texts else '',
                  'description': texts[2] if len(texts) > 2 else '',
                  'prefecture': pref.group(1) if pref else '',
                  'tags': tags.group(1).split(',') if tags else ['即売会'],
                  'location': pref.group(1) if pref else ''
              }

          # Build detail section from template
          desc_marker = tpl_event.get('description', '')
          section_match = re.search(r'<div class="detail-section">.*?</div>', template, re.DOTALL)
          detail_section = section_match.group(0) if section_match else ''

          for slug in missing_slugs:
              ev_json = next((e for e in events if e['slug'] == slug), None)
              card = get_card_data(slug)
              if not ev_json and not card:
                  print(f'  Skipping {slug}: no data')
                  continue
              ev = ev_json or {}
              cd = card or {}
              name = ev.get('name') or cd.get('name', slug)
              date = ev.get('date') or cd.get('date', '')
              date_end = ev.get('dateEnd') or cd.get('dateEnd', '')
              date_display = ev.get('dateDisplay') or cd.get('dateDisplay', date)
              location = ev.get('location') or cd.get('location', '')
              prefecture = ev.get('prefecture') or cd.get('prefecture', '')
              tags = ev.get('tags') or cd.get('tags', ['即売会'])
              description = ev.get('description') or cd.get('description', f'{name}のイベント詳細ページです。')

              html = template
              # Replace detail section
              if detail_section:
                  new_section = f'<div class="detail-section">\n                <h2 class="detail-section-title">概要</h2>\n                <p>{description}</p>\n              </div>'
                  html = html.replace(detail_section, new_section)
              html = html.replace(tpl_event['name'], name)
              html = html.replace(tpl_slug, slug)
              html = html.replace(f'data-date="{tpl_event["date"]}"', f'data-date="{date}"')
              html = html.replace(f'data-date-end="{tpl_event.get("dateEnd", tpl_event["date"])}"', f'data-date-end="{date_end or date}"')
              if tpl_event.get('location'):
                  html = html.replace(tpl_event['location'], location or prefecture)
              html = html.replace(tpl_event.get('prefecture', '東京') + '都', prefecture)
              tpl_tags = ','.join(tpl_event.get('tags', []))
              new_tags = ','.join(tags) if isinstance(tags, list) else tags
              html = html.replace(tpl_tags, new_tags)
              if tpl_event.get('description'):
                  html = html.replace(tpl_event['description'], description)

              out_path = os.path.join('events', f'{slug}.html')
              with open(out_path, 'w', encoding='utf-8') as f:
                  f.write(html)
              print(f'  Created: {out_path}')

          print('Done!')
          PYEOF
      
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events/*.html
          git diff --cached --quiet || git commit -m "feat: add missing event detail pages"
          git push
