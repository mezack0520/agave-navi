name: Link Check (リンク切れ監視)

on:
  schedule:
    # 毎週月曜 10:00 JST (日曜 25:00 UTC → 月曜 01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run link checker
        run: bash scripts/check-links.sh

      - name: Create issue if broken links found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BROKEN=$(cat /tmp/broken-count 2>/dev/null || echo "0")
          WARN=$(cat /tmp/warn-count 2>/dev/null || echo "0")

          if [ "$BROKEN" -gt 0 ]; then
            TITLE="⚠️ リンク切れ検出 (${BROKEN}件) - $(date +%Y-%m-%d)"
            LABEL="bug,monitoring"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/link-check-report.md \
              --label "$LABEL" \
              --repo ${{ github.repository }} || true
          elif [ "$WARN" -gt 0 ]; then
            TITLE="📋 リンクチェック警告 (${WARN}件) - $(date +%Y-%m-%d)"
            LABEL="monitoring"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/link-check-report.md \
              --label "$LABEL" \
              --repo ${{ github.repository }} || true
          else
            echo "✅ All links OK — no issue created"
          fi
