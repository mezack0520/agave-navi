# [DEPRECATED] This workflow has been consolidated into one of:
#   - daily.yml / weekly-enrichment.yml / weekly-discovery.yml / health.yml
# Cron trigger removed; workflow_dispatch kept for manual rollback only.

name: Link Check (リンク切れ監視)

on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run link checker
        run: bash scripts/check-links.sh

      - name: Create issue if broken links found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BROKEN=$(cat /tmp/broken-count 2>/dev/null || echo "0")
          WARN=$(cat /tmp/warn-count 2>/dev/null || echo "0")

          if [ "$BROKEN" -gt 0 ]; then
            TITLE="⚠️ リンク切れ検出 (${BROKEN}件) - $(date +%Y-%m-%d)"
            LABEL="bug,monitoring"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/link-check-report.md \
              --label "$LABEL" \
              --repo ${{ github.repository }} || true
          elif [ "$WARN" -gt 0 ]; then
            TITLE="📋 リンクチェック警告 (${WARN}件) - $(date +%Y-%m-%d)"
            LABEL="monitoring"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/link-check-report.md \
              --label "$LABEL" \
              --repo ${{ github.repository }} || true
          else
            echo "✅ All links OK — no issue created"
          fi
