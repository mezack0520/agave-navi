<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111"/>
      <stop offset="100%" style="stop-color:#333"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stylized Agave leaf / "A" mark -->
  <g transform="translate(256, 280)">
    <!-- Center spine -->
    <path d="M0,-200 L0,80" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Left leaves -->
    <path d="M0,-40 Q-80,-100 -60,-190" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0,10 Q-100,-30 -110,-140" stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M0,55 Q-110,20 -140,-80" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M0,80 Q-100,60 -150,-10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Right leaves -->
    <path d="M0,-40 Q80,-100 60,-190" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0,10 Q100,-30 110,-140" stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M0,55 Q110,20 140,-80" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M0,80 Q100,60 150,-10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Terminal spine tip -->
    <circle cx="0" cy="-204" r="5" fill="#e63946"/>
  </g>
  <!-- "AEN" text at bottom -->
  <text x="256" y="450" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="16">AEN</text>
</svg>
